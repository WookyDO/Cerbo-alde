; Eigenständige Prüf-Firmware für die LIN-Ports der ESP32_LIN-Platine.
; Bedienung: siehe run_test.py
;
;   pio run -e esp32_lin -t upload --upload-port /dev/cu.usbmodemXXX

[env:esp32_lin]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_upload.flash_size = 4MB
monitor_speed = 115200
build_flags = -Wall -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
