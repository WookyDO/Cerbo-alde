; Kopie als config.ini anlegen (install.sh macht das beim ersten Mal).

[bridge]
; IP-Adresse der Bridge (WomoLIN LIN-Controller, im Router fest zuweisen)
host = 192.168.1.50
port = 7020
; auto: Heizungstyp aus der Meldung der Bridge übernehmen; oder alde / truma
heater = auto

[dbus]
; VRM-Geräteinstanzen, nur ändern falls belegt
switch_instance = 60
indoor_instance = 61
; Alde: Außentemperatur, Truma: Wassertemperatur
outdoor_instance = 62
water_instance = 62

; Anzeigenamen, nur bei Bedarf eintragen
[names.alde]
group = Alde Heizung
setpoint = Raumtemperatur
gas = Gas
electric = Elektro (kW)
water = Warmwasser
indoor = Alde Innen
outdoor = Alde Aussen

[names.truma]
group = Truma Heizung
setpoint = Raumtemperatur
mode = Heizstufe
water = Warmwasser
mix = Energie
electric = Elektro
indoor = Truma Innen
water_temp = Truma Wasser
