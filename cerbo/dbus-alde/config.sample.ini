; Kopie als config.ini anlegen (install.sh macht das beim ersten Mal).

[bridge]
; IP-Adresse des WomoLIN LIN-Controllers (im Router fest zuweisen)
host = 192.168.1.50
port = 7020

[dbus]
; VRM-Geräteinstanzen, nur ändern falls belegt
switch_instance = 60
indoor_instance = 61
outdoor_instance = 62

[names]
group = Alde Heizung
setpoint = Raumtemperatur
gas = Gas
electric = Elektro (kW)
water = Warmwasser
indoor = Alde Innen
outdoor = Alde Aussen
