; Alde-LIN-Bridge für den WomoLIN LIN-Controller (ESP32, 16 MB)
;
;   pio run -e womolin -t upload      Firmware per USB flashen
;   pio run -e womolin_ota -t upload  Firmware per WLAN (OTA) aktualisieren
;   pio test -e native                Protokolltests auf dem PC

[env:womolin]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags = -Wall

[env:womolin_ota]
extends = env:womolin
upload_protocol = espota
upload_port = alde-bridge.local
; Passwort wie OTA_PASSWORD in include/secrets.h
upload_flags = --auth=${sysenv.ALDE_OTA_PASSWORD}

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
