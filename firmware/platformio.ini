; LIN-Heizungs-Bridge für die ESP32_LIN-Platine (ESP32-C3, 4 MB) und den
; WomoLIN LIN-Controller (ESP32, 16 MB)
;
;   pio run -e esp32_lin -t upload        ESP32_LIN per USB flashen
;   pio run -e esp32_lin_ota -t upload    ESP32_LIN per WLAN (OTA)
;   pio run -e esp32_lin_sim -t upload    ESP32_LIN im Testbetrieb (USB)
;   pio run -e esp32_lin_sim_ota -t upload
;
;   pio run -e womolin -t upload          Firmware per USB flashen
;   pio run -e womolin_ota -t upload      Firmware per WLAN (OTA) aktualisieren
;   pio run -e womolin_sim -t upload      Testbetrieb mit simuliertem Alde-Panel (USB)
;   pio run -e womolin_sim_ota -t upload  dasselbe per OTA
;   pio test -e native                    Protokolltests auf dem PC
;
; Heizungstyp, WLAN, IP und Passwörter werden auf der Setup-Seite der Bridge
; eingestellt. Für OTA muss LIN_OTA_PASSWORD das dort gesetzte OTA-Passwort enthalten.

[env:womolin]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags = -Wall

[ota]
upload_protocol = espota
upload_port = lin-bridge.local
upload_flags = --auth=${sysenv.LIN_OTA_PASSWORD}

[env:womolin_ota]
extends = env:womolin, ota

; Ohne Alde testen: Der Controller beantwortet seine LIN-Abfragen selbst über
; den Transceiver (12 V nötig). Nicht an der echten Heizung verwenden.
[env:womolin_sim]
extends = env:womolin
build_flags = ${env:womolin.build_flags} -DHEATER_SIM

[env:womolin_sim_ota]
extends = env:womolin_sim, ota

; ESP32_LIN: ESP32-C3-WROOM-02-N4, Flashen und Log über den nativen USB
; (USB-Serial/JTAG). Truma an LIN1 (J2/J6), Alde an LIN2 (J5/J7, JP1 gesteckt).
[env:esp32_lin]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
build_flags = -Wall -DBOARD_ESP32_LIN -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32_lin_ota]
extends = env:esp32_lin, ota

[env:esp32_lin_sim]
extends = env:esp32_lin
build_flags = ${env:esp32_lin.build_flags} -DHEATER_SIM

[env:esp32_lin_sim_ota]
extends = env:esp32_lin_sim, ota

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
